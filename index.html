<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Photo Shift</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#0f172a">
    <meta name="description"
        content="Photo Shift — slide rows and columns to reassemble the image! A fun photo puzzle game you can play with your own photos, camera, or random images.">

    <!-- Open Graph (Facebook, Telegram, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://photo-shift.netlify.app/">
    <meta property="og:title" content="Photo Shift — Slide & Solve Photo Puzzles">
    <meta property="og:description"
        content="Drag rows and columns to reassemble scrambled photos. Play with your camera, gallery, or random images. Free, no install needed!">
    <meta property="og:image" content="https://photo-shift.netlify.app/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Photo Shift">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://photo-shift.netlify.app/">
    <meta name="twitter:title" content="Photo Shift — Slide & Solve Photo Puzzles">
    <meta name="twitter:description"
        content="Drag rows and columns to reassemble scrambled photos. Play with your camera, gallery, or random images. Free, no install needed!">
    <meta name="twitter:image" content="https://photo-shift.netlify.app/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Menu Screen -->
        <section id="menu-screen" class="screen active">
            <h1 class="title">Photo <span>Shift</span> <small class="version">v0.3.0</small></h1>

            <div class="glass-panel menu-panel">
                <div class="setting-group">
                    <label>Difficulty</label>
                    <div class="difficulty-grid" id="difficulty-options">
                        <label class="radio-btn"><input type="radio" name="difficulty" value="2">
                            <span>2x2</span></label>
                        <label class="radio-btn"><input type="radio" name="difficulty" value="3" checked>
                            <span>3x3</span></label>
                        <label class="radio-btn"><input type="radio" name="difficulty" value="4">
                            <span>4x4</span></label>
                        <label class="radio-btn"><input type="radio" name="difficulty" value="5">
                            <span>5x5</span></label>
                    </div>
                </div>

                <div class="setting-group mt-4">
                    <label>Choose a Photo</label>
                    <div class="source-grid">
                        <div class="source-card" id="card-camera">
                            <div class="card-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                                    </path>
                                    <circle cx="12" cy="13" r="4"></circle>
                                </svg>
                            </div>
                            <span>Take Photo</span>
                        </div>

                        <div class="source-card" id="card-gallery">
                            <div class="card-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                            </div>
                            <span>Gallery</span>
                        </div>

                        <div class="source-card" id="card-picsum">
                            <div class="card-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M9.59 4.59A2 2 0 1 1 11 8H2V6h9.59l2.41 2.41z" />
                                    <circle cx="12" cy="12" r="10" />
                                    <path d="M12 8v8" />
                                    <path d="M8 12h8" />
                                </svg>
                                <!-- Alternative Random/Magic Icon -->
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path
                                        d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                                </svg>
                            </div>
                            <span>Random</span>
                        </div>
                    </div>

                    <input type="file" id="file-upload" accept="image/*" style="display:none">
                    <input type="file" id="camera-upload" accept="image/*" capture="environment" style="display:none">
                    <input type="hidden" id="selected-source" value="picsum">
                </div>
            </div>

            <div class="footer-info">Drag to shift rows and columns. Reassemble the image!</div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen hidden">
            <header class="game-header glass-panel">
                <div style="display: flex; gap: 0.5rem;">
                    <button id="btn-return" class="icon-btn" title="Return to Menu">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
                            fill="none">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </button>
                    <button id="btn-restart" class="icon-btn" title="New Photo">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                    </button>
                </div>
                <div class="moves">Moves: <span id="move-counter" class="highlight">0</span></div>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="btn-sound" class="icon-btn" title="Toggle Sound">
                        <svg id="icon-sound-on" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                        <svg id="icon-sound-off" viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" style="display:none;">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <line x1="23" y1="9" x2="17" y2="15"></line>
                            <line x1="17" y1="9" x2="23" y2="15"></line>
                        </svg>
                    </button>
                    <button id="btn-hint" class="icon-btn" title="Show Hint">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="board-container" class="board-container">
                <!-- Dynamically generated board will be appended here -->
                <div id="game-board"></div>
            </div>

            <div id="loading-overlay" class="overlay hidden glass-panel">
                <div class="spinner"></div>
                <p>Loading image...</p>
            </div>
        </section>

        <!-- Hint Modal -->
        <div id="hint-modal" class="modal hidden">
            <div class="modal-content glass-panel">
                <h2>Hint: <span>Original Image</span></h2>
                <div class="image-wrapper">
                    <img id="hint-image-view" src="" alt="Hint">
                </div>
                <button id="btn-close-hint" class="primary-btn mt-4">Close Hint</button>
            </div>
        </div>

        <!-- Success Modal -->
        <div id="success-modal" class="modal hidden">
            <div class="modal-content glass-panel text-center">
                <h2>Puzzle <span>Solved!</span> 🎉</h2>

                <div class="success-image-wrapper mt-4">
                    <img id="success-image-view" src="" alt="Solved Puzzle">
                </div>

                <p class="mt-4">Difficulty: <span id="final-difficulty" class="highlight">3x3</span></p>
                <p>You completed the image in</p>
                
                <div style="display: flex; align-items: baseline; justify-content: center; gap: 0.5rem; margin: 0.5rem 0 1rem 0;">
                    <span id="final-moves" class="highlight huge" style="display: inline-block; margin: 0; line-height: 0.9;">0</span>
                    <span style="font-size: 1.25rem; font-weight: 500; opacity: 0.9;">moves.</span>
                </div>

                <div class="mt-6 flex flex-col gap-3">
                    <button id="btn-share" class="secondary-btn flex align-center justify-center gap-2">
                        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="18" cy="5" r="3"></circle>
                            <circle cx="6" cy="12" r="3"></circle>
                            <circle cx="18" cy="19" r="3"></circle>
                            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                        </svg>
                        Share Result
                    </button>
                    <button id="btn-play-again" class="primary-btn">Play Again</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <script src="audio.js"></script>
    <script src="game.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW Registered', reg.scope))
                    .catch(err => console.error('SW Registration failed', err));
            });
        }
    </script>
</body>

</html>
